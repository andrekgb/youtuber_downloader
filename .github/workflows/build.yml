name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yt-dlp pillow imageio-ffmpeg pyinstaller

      - name: Fetch HandBrakeCLI
        run: python -c "import build; build.ensure_handbrake_cli('mac')"

      - name: Fetch QuickJS (JavaScript runtime for yt-dlp)
        run: python -c "import build; build.ensure_quickjs('mac', '${{ matrix.arch }}')"

      - name: Build .app and .dmg
        run: |
          pyinstaller ve2zdx_downloader.spec --clean --noconfirm

          # Staging for DMG
          mkdir -p dist/_dmg_staging
          cp -R "dist/VE2ZDX Downloader.app" "dist/_dmg_staging/VE2ZDX Downloader.app"
          ln -s /Applications "dist/_dmg_staging/Applications"

          hdiutil create \
            -volname "VE2ZDX Downloader" \
            -srcfolder dist/_dmg_staging \
            -ov -format UDZO \
            "dist/VE2ZDXDownloader-${{ matrix.arch }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: VE2ZDXDownloader-mac-${{ matrix.arch }}
          path: dist/VE2ZDXDownloader-${{ matrix.arch }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yt-dlp pillow imageio-ffmpeg pyinstaller

      - name: Fetch HandBrakeCLI
        run: python -c "import build; build.ensure_handbrake_cli('win')"

      - name: Fetch QuickJS (JavaScript runtime for yt-dlp)
        run: python -c "import build; build.ensure_quickjs('win', 'x86_64')"

      - name: Build .exe
        run: |
          pyinstaller ve2zdx_downloader.spec --clean --noconfirm

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: VE2ZDXDownloader-windows
          path: dist/VE2ZDXDownloaderSetup.exe
